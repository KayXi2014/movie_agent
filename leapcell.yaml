runtime: python
startCommand: python -m uvicorn main:app --host 0.0.0.0 --port 8080
buildCommand: pip install -r requirements-leapcell.txt
port: 8080
memory: 1gb
envs:
  - name: OLLAMA_API_KEY
    # Set this secret in the Leapcell dashboard — never commit the actual key
  - name: HF_TOKEN
    # Required for hosted Hugging Face query embeddings
  - name: ENABLE_LLM_INTENT
    value: "1"
    # Set to "0" to disable the short intent LLM in production
